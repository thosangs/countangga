<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kalkulator tangga rumah dengan model 3D dan cek kenyamanan." />
  <title>Countangga</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪜</text></svg>" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span aria-hidden="true">🪜</span> Countangga</div>
    <p class="lede">Klik field di kiri, 3D di kanan nunjukin bagian mana.</p>
  </header>

  <main class="layout">
    <section class="panel form-panel">
      <form id="stair-form">
        <label class="field" data-part="floorHeight">
          <span>Tinggi lantai 1 → 2</span>
          <span class="input-wrap">
            <input id="floorHeight" type="number" min="180" max="600" step="1" value="320" required />
            <em>cm</em>
          </span>
        </label>
        <label class="field" data-part="openingLength">
          <span>Panjang lubang L2</span>
          <span class="input-wrap">
            <input id="openingLength" type="number" min="150" max="1200" step="1" value="340" required />
            <em>cm</em>
          </span>
        </label>
        <label class="field" data-part="stairWidth">
          <span>Lebar tangga</span>
          <span class="input-wrap">
            <input id="stairWidth" type="number" min="60" max="250" step="1" value="90" required />
            <em>cm</em>
          </span>
        </label>
        <label class="field" data-part="treadDepth">
          <span>Kedalaman pijakan</span>
          <span class="input-wrap">
            <input id="treadDepth" type="number" min="18" max="40" step=".5" value="27" required />
            <em>cm</em>
          </span>
        </label>
        <label class="field" data-part="turnAngle">
          <span>Bentuk belok</span>
          <select id="turnAngle">
            <option value="90">L — belok 90°</option>
            <option value="180">U — belok 180°</option>
          </select>
        </label>
        <label class="field" data-part="turnDir">
          <span>Arah belok</span>
          <select id="turnDir">
            <option value="1">Kanan</option>
            <option value="-1">Kiri</option>
          </select>
        </label>
        <label class="field" data-part="turnStep">
          <span>Bordes di anak ke-</span>
          <span class="input-wrap">
            <input id="turnStep" type="number" min="2" max="30" step="1" value="9" required />
            <em>anak</em>
          </span>
        </label>
        <button type="submit">Hitung</button>
      </form>
    </section>

    <section class="panel viewer-panel">
      <div class="viewer-head">
        <strong id="caption">Klik field untuk lihat bagiannya</strong>
        <span>drag = putar</span>
      </div>
      <div id="viewer"></div>
    </section>

    <section class="panel result-panel" aria-live="polite">
      <div class="verdict" id="verdict">Ideal</div>
      <div class="metrics">
        <div><small>Anak tangga</small><b id="riseCount">18</b></div>
        <div><small>Tinggi anak</small><b id="riserHeight">17,8 cm</b></div>
        <div><small>Pijakan</small><b id="treadResult">27 cm</b></div>
        <div><small>Kemiringan</small><b id="pitch">33°</b></div>
        <div><small>2T + L</small><b id="blondel">63 cm</b></div>
        <div><small>Butuh lubang</small><b id="requiredOpening">333 cm</b></div>
      </div>
      <ul id="checks"></ul>
    </section>
  </main>

  <p class="disclaimer">Estimasi geometri, bukan gambar kerja. Cek ulang ke arsitek/sipil sebelum bangun.</p>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
